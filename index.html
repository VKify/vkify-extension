<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VKify - Настройки</title>
  <link rel="stylesheet" href="./assets/popup.css">
  <style>
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f5f5f7;
      --text-primary: #1d1d1f;
    }
    [data-theme="dark"] {
      --bg-primary: #1c1c1e;
      --bg-secondary: #000000;
      --text-primary: #f5f5f7;
    }
    html, body {
      background-color: var(--bg-secondary);
      color: var(--text-primary);
      margin: 0;
      padding: 0;
    }
    #root {
      opacity: 0;
      transition: opacity 0.15s ease;
    }
    #root.ready {
      opacity: 1;
    }
  </style>
  <!-- Скрипт инициализации темы - загружается первым -->
  <script src="./theme-init.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./src/popup/main.jsx"></script>
</body>
</html>
