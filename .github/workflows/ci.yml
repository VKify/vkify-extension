name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Typecheck & Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Guardrails (ESLint cross-browser invariants)
        run: npm run lint

      - name: Tests
        run: npm test

  build:
    name: Cross-browser build, smoke & lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Chrome and Firefox
        run: npm run build

      - name: Verify build structure & manifests
        run: npm run verify:build

      - name: Bundle size budget (gzip)
        run: npm run check:size

      - name: Lint Firefox package (web-ext, fails on errors)
        run: npm run lint:firefox

      - name: Save verified browser builds
        uses: actions/upload-artifact@v4
        with:
          name: browser-builds
          path: dist/
          retention-days: 7
          if-no-files-found: error

  e2e:
    name: E2E (browser builds, UI & page features)
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # UI fixtures exercise both browser builds; extension tests load Chrome.
      - name: Restore verified Chrome and Firefox builds
        uses: actions/download-artifact@v4
        with:
          name: browser-builds
          path: dist/

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Popup extension tests use a headed persistent context; fixtures run headless.
      - name: Run E2E (headed under xvfb)
        run: xvfb-run -a npm run test:e2e

      - name: Save E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
