name: Release

# Тег вида v1.5.0 → собирает все три браузера, прогоняет те же quality-gates,
# что и CI, пакует .zip для каждого стора, подписывает Firefox-сборку на AMO
# (если заданы секреты) и публикует GitHub Release с артефактами.
#
# Как выпускать:
#   1. bump версии в manifest/base.json + package.json
#   2. git tag v1.5.0 && git push origin v1.5.0
#
# Секреты (Settings → Secrets → Actions), все опциональны:
#   AMO_JWT_ISSUER / AMO_JWT_SECRET — подпись Firefox (addons.mozilla.org/developers/addon/api/key)
# Публикация в Chrome Web Store / Opera — пока вручную из артефактов релиза
# (CWS требует OAuth refresh-token; шаг легко добавить ниже при готовности).

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # создание GitHub Release

jobs:
  release:
    name: Build, package & publish
    runs-on: ubuntu-latest
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Те же ворота качества, что в CI — релиз не выйдет на красном.
      - name: Quality gates
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Build all three
        run: npm run build

      - name: Verify & size budget
        run: |
          npm run verify:build
          npm run check:size

      - name: Package store ZIPs
        run: |
          mkdir -p dist/packages
          npx web-ext build -s dist/chrome  -a dist/packages --filename "vkify-chrome-${GITHUB_REF_NAME}.zip"  --overwrite-dest
          npx web-ext build -s dist/firefox -a dist/packages --filename "vkify-firefox-${GITHUB_REF_NAME}.zip" --overwrite-dest
          npx web-ext build -s dist/opera   -a dist/packages --filename "vkify-opera-${GITHUB_REF_NAME}.zip"   --overwrite-dest

      # Подписанный .xpi для самораздачи / последующей загрузки на AMO.
      # Шаг пропускается, если секреты AMO не заданы.
      - name: Sign Firefox add-on (AMO, unlisted)
        if: ${{ env.AMO_JWT_ISSUER != '' }}
        run: |
          npx web-ext sign -s dist/firefox -a dist/packages \
            --channel=unlisted \
            --api-key="$AMO_JWT_ISSUER" --api-secret="$AMO_JWT_SECRET" \
            || echo "::warning::AMO signing failed (version already signed?) — continuing"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/packages/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
