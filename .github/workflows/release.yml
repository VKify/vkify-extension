name: Release

# A vX.Y.Z tag builds all supported browsers, runs the same quality gates as CI,
# packages store-ready archives, optionally signs Firefox, and publishes a
# GitHub Release with curated bilingual notes when available.
#
# Release procedure:
#   1. Keep package.json, package-lock.json, and manifest/base.json in sync.
#   2. Add .github/release-notes/vX.Y.Z.md.
#   3. Push the release commit, then push the vX.Y.Z tag.
#
# Optional repository secrets:
#   AMO_JWT_ISSUER / AMO_JWT_SECRET — Firefox signing via AMO.
# Chrome Web Store and Opera publishing remain manual from release artifacts.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build, package & publish
    runs-on: ubuntu-latest
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        shell: bash
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          LOCK_VERSION="$(node -p "require('./package-lock.json').version")"
          MANIFEST_VERSION="$(node -p "require('./manifest/base.json').version")"

          for VERSION in "$PACKAGE_VERSION" "$LOCK_VERSION" "$MANIFEST_VERSION"; do
            if [[ "$VERSION" != "$TAG_VERSION" ]]; then
              echo "::error::Tag ${RELEASE_TAG} does not match project version ${VERSION}"
              exit 1
            fi
          done

      - name: Quality gates
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Build all three browsers
        run: npm run build

      - name: Verify build, size budget, and Firefox manifest
        run: |
          npm run verify:build
          npm run check:size
          npm run lint:firefox

      - name: Package store ZIPs
        run: |
          mkdir -p dist/packages
          npx web-ext build -s dist/chrome  -a dist/packages --filename "vkify-chrome-${RELEASE_TAG}.zip"  --overwrite-dest
          npx web-ext build -s dist/firefox -a dist/packages --filename "vkify-firefox-${RELEASE_TAG}.zip" --overwrite-dest
          npx web-ext build -s dist/opera   -a dist/packages --filename "vkify-opera-${RELEASE_TAG}.zip"   --overwrite-dest

      - name: Sign Firefox add-on (AMO, unlisted)
        if: ${{ env.AMO_JWT_ISSUER != '' && env.AMO_JWT_SECRET != '' }}
        run: |
          npx web-ext sign -s dist/firefox -a dist/packages \
            --channel=unlisted \
            --api-key="$AMO_JWT_ISSUER" --api-secret="$AMO_JWT_SECRET" \
            || echo "::warning::AMO signing failed (version already signed?) — continuing"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          NOTES_FILE=".github/release-notes/${RELEASE_TAG}.md"

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; updating it"
            if [[ -f "$NOTES_FILE" ]]; then
              gh release edit "${RELEASE_TAG}" \
                --title "${RELEASE_TAG}" \
                --notes-file "$NOTES_FILE"
            else
              echo "::warning::No curated release notes found at ${NOTES_FILE}; keeping existing notes"
            fi
            gh release upload "${RELEASE_TAG}" dist/packages/* --clobber
          else
            if [[ -f "$NOTES_FILE" ]]; then
              gh release create "${RELEASE_TAG}" dist/packages/* \
                --title "${RELEASE_TAG}" \
                --notes-file "$NOTES_FILE" \
                --verify-tag
            else
              echo "::warning::No curated release notes found at ${NOTES_FILE}"
              gh release create "${RELEASE_TAG}" dist/packages/* \
                --title "${RELEASE_TAG}" \
                --generate-notes \
                --verify-tag
            fi
          fi
